name: book_reel
description: "BookReel: read books as short reel cards, build a reading habit."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  path_provider: ^2.1.6
  archive: ^4.6.0
  xml: ^7.1.0
  html: ^0.15.7
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  flutter_tts: ^4.2.5
  pdfrx: ^2.12.0
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  http: ^1.6.0
  crypto: ^3.0.8
  collection: ^1.19.1
  intl: ^0.20.3
  path: ^1.9.1
  just_audio: ^0.10.6
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  # On-device AI for the Free plan (LiteRT-LM). Pinned: these packages move fast.
  flutter_edge_ai: 2.6.0
  flutter_edge_ai_litertlm: 1.20.0
  # The natural voice on the phone (Kokoro, run by sherpa-onnx). Pinned to the
  # last release with espeak-ng built in: 2.x needs a word list instead, and
  # books are full of words no list has.
  sherpa_onnx: 1.13.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # The logo (made from assets/images/logo.png; Android icons in res/mipmap-*).
    - assets/images/logo_512.png
    - assets/images/logo_mark.png
    # Your own background pictures (see the README in the folder).
    - assets/images/backgrounds/
    - assets/books/
    # The privacy policy and terms (also served by the server at /privacy and /terms).
    - assets/legal/
    # Licences of the on-device voice's parts (see the README there).
    - assets/licences/espeak-ng-GPL-3.0.txt
    - assets/licences/kokoro-Apache-2.0.txt
    - assets/licences/onnxruntime-MIT.txt
    # Ambient loops (licences in assets/sounds/CREDITS.md), and your own music
    # (see the README in the folder).
    - assets/sounds/
    - assets/sounds/music/
    - assets/lexicon/zipf.tsv.gz
    - assets/lexicon/wordnet.json.gz
    # Font licences, shown on the app's licences page.
    - assets/fonts/OFL-Literata.txt
    - assets/fonts/OFL-AtkinsonHyperlegible.txt
    - assets/fonts/OFL-DMSerifDisplay.txt
    - assets/fonts/OFL-Lora.txt
    - assets/fonts/OFL-PlayfairDisplay.txt
    - assets/fonts/OFL-Alegreya.txt
    - assets/fonts/OFL-Cinzel.txt
    - assets/fonts/OFL-Exo2.txt
    - assets/fonts/OFL-Orbitron.txt
    - assets/fonts/OFL-LibreBaskerville.txt
    - assets/fonts/OFL-Oswald.txt
    - assets/fonts/OFL-Outfit.txt
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-Merriweather.txt
    - assets/fonts/OFL-SourceSerif4.txt
    - assets/fonts/OFL-EBGaramond.txt
    - assets/fonts/OFL-CrimsonPro.txt
    - assets/fonts/OFL-Newsreader.txt
    - assets/fonts/OFL-Bitter.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Lexend.txt
    - assets/fonts/OFL-OpenDyslexic.txt

  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
    # Book voices (lib/ui/typography.dart): unmodified Google Fonts (OFL),
    # variable weight where available.
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya.ttf
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron.ttf
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    # More reading fonts (Settings → Text & theme). Unmodified, except Source
    # Serif 4, EB Garamond and Inter: their regular and bold weights are
    # instanced from the variable fonts (no Reserved Font Names) to keep the
    # app small. Variable ones get their weight from the text style.
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
    - family: CrimsonPro
      fonts:
        - asset: assets/fonts/CrimsonPro.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
